Sidebar blade drop down sidebarversion: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: barber-shop-app
    container_name: barber_shop_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-barber_shop}
      DB_USERNAME: ${DB_USERNAME:-barber_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
    networks:
      - barber-network

  db:
    image: mysql:8.0
    container_name: barber_shop_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-barber_shop}
      MYSQL_USER: ${DB_USERNAME:-barber_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - barber-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: barber_shop_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    depends_on:
      - db
    networks:
      - barber-network

networks:
  barber-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
